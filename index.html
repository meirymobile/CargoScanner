<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>סורק משולב: ברקוד + OCR עברית</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-orange: #ff9500;
            --ios-green: #34c759;
            --ios-bg: #f2f2f7;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid transparent;
            transition: border-color 0.3s;
        }

        .scan-success { border-color: var(--ios-green) !important; }

        .info-panel {
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        #scanned-text {
            display: block;
            background: #f0f0f5;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            word-break: break-all;
            margin: 15px 0;
            color: #1c1c1e;
            min-height: 1.5em;
            text-align: right;
            white-space: pre-wrap;
        }

        .btn {
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
            color: white;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-blue { background-color: var(--ios-blue); }
        .btn-orange { background-color: var(--ios-orange); }

        #ocr-status {
            display: none;
            color: var(--ios-orange);
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #status-label { color: #8e8e93; font-size: 14px; }
    </style>
</head>
<body>

    <h2 style="margin-top:40px;">סורק לוגיסטי חכם</h2>
    
    <div id="reader"></div>
    
    <div class="info-panel">
        <div id="ocr-status">טוען מנוע שפה (עברית+אנגלית)...</div>
        <div id="status-label">הסורק פעיל - כוון לברקוד</div>
        <div id="scanned-text">---</div>
        
        <button class="btn btn-blue" onclick="copyToClipboard()">העתק תוצאה לזיכרון</button>
        <button class="btn btn-orange" onclick="runOCR()">זהה טקסט (עברית/אנגלית)</button>
    </div>

    <script>
        const textDisplay = document.getElementById('scanned-text');
        const statusLabel = document.getElementById('status-label');
        const ocrStatus = document.getElementById('ocr-status');
        const readerElement = document.getElementById('reader');

        // פונקציות חיווי
        function successFeedback() {
            if (navigator.vibrate) navigator.vibrate(100);
            readerElement.classList.add('scan-success');
            setTimeout(() => readerElement.classList.remove('scan-success'), 600);
        }

        // 1. הגדרת סורק הברקוד
        const html5QrCode = new Html5Qrcode("reader");
        const qrConfig = { 
            fps: 25, 
            qrbox: { width: 320, height: 150 },
            videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        };

        html5QrCode.start({ facingMode: "environment" }, qrConfig, (decodedText) => {
            if (textDisplay.innerText === decodedText) return;
            textDisplay.innerText = decodedText;
            statusLabel.innerText = "ברקוד זוהה בהצלחה!";
            successFeedback();
            navigator.clipboard.writeText(decodedText);
        });

        // 2. פונקציית OCR משולבת עברית ואנגלית
        async function runOCR() {
            ocrStatus.style.display = 'block';
            statusLabel.innerText = "מנתח תמונה...";
            
            try {
                // לכידת תמונה מהמצלמה
                const video = document.querySelector('#reader video');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // הפעלת Tesseract עם שתי שפות
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('heb+eng');
                await worker.initialize('heb+eng');
                
                const { data: { text } } = await worker.recognize(canvas);
                
                textDisplay.innerText = text.trim();
                statusLabel.innerText = "הטקסט פוענח!";
                successFeedback();
                navigator.clipboard.writeText(text.trim());
                
                await worker.terminate();
            } catch (err) {
                console.error(err);
                statusLabel.innerText = "שגיאה בפענוח OCR";
            } finally {
                ocrStatus.style.display = 'none';
            }
        }

        function copyToClipboard() {
            const text = textDisplay.innerText;
            if (text !== "---") {
                navigator.clipboard.writeText(text);
                alert("הועתק לזיכרון!");
            }
        }
    </script>
</body>
</html>
