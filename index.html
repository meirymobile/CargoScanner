<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>סורק שטרי מטען</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f2f2f7; padding: 20px; margin: 0; }
        #reader { width: 100%; max-width: 500px; margin: 20px auto; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .info-panel { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; }
        #scanned-text { display: block; margin: 15px 0; font-family: monospace; font-size: 1.4em; color: #007aff; background: #f0f0f5; padding: 10px; border-radius: 8px; word-break: break-all; }
        .btn { background: #007aff; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; width: 100%; font-weight: bold; cursor: pointer; }
        #status { margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="margin-top:40px;">סורק לוגיסטי</h2>
    <div id="reader"></div>
    
    <div class="info-panel">
        <div id="status">מחפש ברקוד...</div>
        <span id="scanned-text">---</span>
        <button id="copy-btn" class="btn" onclick="copyText()">העתק מספר שטר מטען</button>
    </div>

    <script>
        const statusElem = document.getElementById('status');
        const textElem = document.getElementById('scanned-text');

        function onScanSuccess(decodedText) {
            textElem.innerText = decodedText;
            statusElem.innerText = "נמצא שטר מטען! ✅";
            statusElem.style.color = "#34c759";
            navigator.vibrate(100); // רטט קצר להצלחה
            copyText(decodedText);
        }

        function copyText(text = null) {
            const t = text || textElem.innerText;
            if (t === "---") return;
            navigator.clipboard.writeText(t).then(() => {
                document.getElementById('copy-btn').innerText = "הועתק לזיכרון! 📋";
                setTimeout(() => { document.getElementById('copy-btn').innerText = "העתק מספר שטר מטען"; }, 2000);
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 25, 
            // תיבה גדולה וצרה שמתאימה למבנה של שטר מטען
            qrbox: { width: 320, height: 120 }, 
            aspectRatio: 1.0,
            // הגדרות רזולוציה גבוהה במיוחד
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        // הפעלה עם תמיכה בכל הפורמטים הלוגיסטיים
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            statusElem.innerText = "שגיאה: וודא HTTPS ואישור מצלמה";
            console.error(err);
        });
    </script>
</body>
</html>
